<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="robots" content="noindex,nofollow"><title>Adri and Héctor's Honeymoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EFE9DF; --surface:#FBF8F2; --surface-2:#E6DED0; --ink:#1D1A15; --muted:#6A6155; --line:#D5CBBB;
  --mad:#A62B1F; --par:#1E4A3D; --bcn:#9C6508; --adm:#4A4238;
  --ok:#2E7A34; --warn:#9A5800; --bad:#B0261D; --onc:#FFFFFF;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15130F; --surface:#1F1B15; --surface-2:#2A251D; --ink:#F0E9DC; --muted:#AB9F8E; --line:#3B342A;
    --mad:#E6725A; --par:#72B99A; --bcn:#E3AE4B; --adm:#B9B4AA; --ok:#6CC173; --warn:#E3A344; --bad:#F07A70; --onc:#121211;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15130F; --surface:#1F1B15; --surface-2:#2A251D; --ink:#F0E9DC; --muted:#AB9F8E; --line:#3B342A;
  --mad:#E6725A; --par:#72B99A; --bcn:#E3AE4B; --adm:#B9B4AA; --ok:#6CC173; --warn:#E3A344; --bad:#F07A70; --onc:#121211;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- header ---------- */
.top{padding-block:22px 12px;display:grid;gap:14px}
.top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-stretch:112%;font-size:clamp(26px,5vw,40px);line-height:1.02;letter-spacing:-.01em;margin:0;text-wrap:balance}
.route{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px;font-family:var(--f-mono);font-size:13px}
.code{display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-weight:600;font-size:11px;letter-spacing:.08em;padding:2px 6px;border-radius:3px;color:var(--onc);background:var(--adm)}
.code.mad{background:var(--mad)} .code.par{background:var(--par)} .code.bcn{background:var(--bcn)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-family:var(--f-mono);font-size:12px}
.lang button{padding:6px 12px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-block:1px solid var(--ink)}
.strip div{padding:10px 12px;display:grid;gap:2px;border-left:1px solid var(--line)}
.strip div:first-child{border-left:0;padding-left:0}
.strip b{font-family:var(--f-mono);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.strip span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.strip button{font-family:var(--f-mono);font-size:20px;font-weight:600;text-align:left;text-decoration:underline dotted;text-underline-offset:4px}
@media (max-width:560px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip div:nth-child(3){border-left:0;padding-left:0}.strip div:nth-child(n+3){border-top:1px solid var(--line)}}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:8px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{white-space:nowrap;padding:8px 14px;border-radius:999px;font-weight:500;font-size:14px}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.sync{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)}

/* ---------- trip overview ---------- */
.days{display:grid;gap:0;margin-top:18px}
.dayrow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.dayrow:hover{background:var(--surface-2)}
.dayrow .date{display:grid;justify-items:start;gap:4px;min-width:74px}
.dayrow .date b{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:26px;line-height:1}
.dayrow .date small{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dayrow .ttl{font-weight:600;font-size:16px;line-height:1.3}
.dayrow .sub{font-size:13px;color:var(--muted);margin-top:2px}
.thumbs{display:flex}
.thumbs img,.thumbs .ph{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--bg);margin-left:-10px;background:var(--surface-2)}
.meter{display:flex;gap:3px;margin-top:6px}
.meter i{width:14px;height:4px;border-radius:2px;background:var(--line)}
.meter i.p{background:var(--ink)} .meter i.b{background:var(--ok)}
@media (max-width:560px){.dayrow{grid-template-columns:auto 1fr}.thumbs{display:none}}

/* ---------- day page ---------- */
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:20px 8px;flex-wrap:wrap}
.dayhead h2{font-family:var(--f-display);font-weight:800;font-stretch:125%;font-size:clamp(30px,7vw,54px);line-height:.95;margin:6px 0 0;text-transform:uppercase;letter-spacing:-.01em}
.dayhead p{margin:8px 0 0;color:var(--muted);max-width:60ch}
.navbtns{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--r);border:1px solid var(--ink);font-weight:500;font-size:14px;line-height:1.2;text-decoration:none;white-space:nowrap}
.btn.fill{background:var(--ink);color:var(--bg)}
.btn.city{background:var(--c);border-color:var(--c);color:var(--onc)}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:6px 10px;font-size:13px}
.tt{display:grid;margin-top:8px}
.row{display:grid;grid-template-columns:62px minmax(0,1fr);gap:14px;padding-block:18px;border-top:1px solid var(--line)}
.row .t{font-family:var(--f-mono);font-size:13px;font-weight:600;padding-top:2px;font-variant-numeric:tabular-nums}
.row .t small{display:block;font-weight:400;color:var(--muted)}
.row h3{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.quiet{padding-block:10px}
.row.quiet .body{color:var(--muted);font-size:14px}
.fork{background:var(--surface);border:1px dashed var(--c);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.fork .q{font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);text-align:left;display:grid;gap:2px;flex:1 1 160px}
.seg button small{color:var(--muted);font-size:12px}
.seg button[aria-pressed="true"]{border:2px solid var(--c);padding:9px 13px;background:var(--surface)}
.seg button[aria-pressed="true"] b{color:var(--c)}
.who{font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.av{width:20px;height:20px;border-radius:50%;object-fit:cover;flex:none}

.cards{display:grid;grid-auto-flow:column;grid-auto-columns:min(80%,290px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-block:12px 6px;scrollbar-width:thin}
@media (min-width:900px){.cards{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));overflow:visible}}
.card{scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;position:relative}
.card.picked{border:2px solid var(--c);margin:-1px}
.card .img{aspect-ratio:4/3;width:100%;max-width:100%;object-fit:cover;background:var(--surface-2);display:block}
.card .open{display:block;text-align:left;width:100%}
.ph{display:flex;align-items:flex-end;overflow:hidden;overflow-wrap:anywhere;padding:12px;aspect-ratio:4/3;width:100%;background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,var(--surface) 10px 20px);font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:18px;line-height:1.05;color:var(--c)}
.card .b{padding:12px;display:grid;gap:6px;flex:1;align-content:start}
.card .nm{font-weight:600;font-size:16px;line-height:1.25}
.card .ar{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.card .why{font-size:14px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;line-height:1.2;padding:3px 7px;border-radius:3px;background:var(--surface-2);display:inline-flex;gap:4px;align-items:center}
.chip.mono{font-family:var(--f-mono)}
.chip.flag{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.chip.good{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.chip.vibe{background:transparent;border:1px solid var(--line)}
.chip.v-local-trendy{border-color:var(--c);color:var(--c);font-weight:600}
.vchip{flex:0 0 auto!important;padding:6px 10px!important;font-size:13px;display:inline-flex!important;gap:6px;align-items:center}
.chip.idea{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.card .ft{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--line)}
.heart{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--muted);padding:4px}
.heart svg{width:20px;height:20px}
.heart[aria-pressed="true"]{color:var(--c)}
.heart[aria-pressed="true"] svg{fill:currentColor}
.pickbadge{position:absolute;top:8px;left:8px;background:var(--c);color:var(--onc);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:4px 8px;border-radius:3px;display:flex;gap:6px;align-items:center}
.pickbadge .av{width:16px;height:16px}
.state{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px;font-size:14px}
.pill{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid currentColor}
.pill.ok{color:var(--ok)} .pill.todo{color:var(--warn)} .pill.none{color:var(--muted)}
.bookform{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:8px}
.bookform label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.bookform input{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:8px;font-size:14px;color:var(--ink);min-width:0}
.bookform .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:560px){.bookform{grid-template-columns:repeat(2,minmax(0,1fr))}}
.more{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:13px}

/* ---------- detail ---------- */
.detail{padding-block:16px 40px;display:grid;gap:18px}
.gallery{display:grid;grid-auto-flow:column;grid-auto-columns:100%;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:var(--r);background:var(--surface-2)}
@media (min-width:800px){.gallery{grid-auto-columns:minmax(0,1fr);grid-auto-flow:column}.gallery.one{grid-auto-columns:100%}}
.gallery img{width:100%;max-width:100%;aspect-ratio:3/2;object-fit:cover;scroll-snap-align:start;display:block}
.gallery .ph{aspect-ratio:3/1;font-size:clamp(28px,6vw,56px)}
.dtitle h2{font-family:var(--f-display);font-weight:800;font-stretch:112%;font-size:clamp(28px,5.5vw,46px);line-height:1;margin:6px 0 0;text-wrap:balance}
.dtitle .why{font-size:17px;margin-top:10px;max-width:60ch}
.dgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:800px){.dgrid{grid-template-columns:1fr}}
.facts{display:grid;border-top:1px solid var(--ink)}
.fact{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.fact dt{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding-top:3px;margin:0}
.fact dd{margin:0;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:8px}
.lk{display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);text-decoration:none;font-size:14px;font-weight:500;background:var(--surface)}
.lk:hover{border-color:var(--ink)}
.lk.primary{background:var(--c);border-color:var(--c);color:var(--onc)}
.rating{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rating b{font-family:var(--f-mono);font-size:22px}
.credits{font-size:11px;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}

/* ---------- lists (to book / admin / calendar) ---------- */
.sec{margin-top:22px}
.sec h2{font-family:var(--f-display);font-weight:800;font-stretch:112%;font-size:24px;margin:0 0 4px}
.sec > p{margin:0 0 10px;color:var(--muted);max-width:65ch}
.list{display:grid;border-top:1px solid var(--ink)}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.li .sq{width:52px;height:52px;border-radius:4px;object-fit:cover;background:var(--surface-2)}
.li .n{font-weight:600}
.li .d{font-size:13px;color:var(--muted)}
.li .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.li{grid-template-columns:auto minmax(0,1fr)}.li .acts{grid-column:1/-1;justify-content:flex-start}}
.urg{font-family:var(--f-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.urg.u1{color:var(--bad)} .urg.u2{color:var(--warn)} .urg.u3{color:var(--muted)}
.check{width:22px;height:22px;border:1.5px solid var(--ink);border-radius:4px;display:inline-flex;align-items:center;justify-content:center}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--onc)}
.calday{margin-top:14px}
.calday h3{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.ev{display:grid;grid-template-columns:94px minmax(0,1fr) auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev .tm{font-family:var(--f-mono);font-size:13px}
.calacts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:14px;z-index:20;max-width:calc(100% - 32px)}
textarea.ics{width:100%;height:140px;font-family:var(--f-mono);font-size:11px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px}
@media (prefers-reduced-motion:no-preference){.card,.dayrow,.btn{transition:border-color .15s,background .15s}}

/* ---------- UX layer ---------- */
.linklike{text-decoration:underline;text-underline-offset:3px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.ph2{font-family:var(--f-display);font-weight:800;font-stretch:112%;font-size:20px;margin:0}
.ph3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start;min-width:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
@media (max-width:800px){.two{grid-template-columns:1fr}}
.intro{margin-top:16px;border:1px solid var(--ink);border-radius:var(--r);padding:16px;background:var(--surface)}
.introhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:800px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.steps .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.steps p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.introbar{margin-top:12px;font-size:14px}
.routebar{display:flex;gap:4px;margin-top:16px}
.routebar > div{border-top:4px solid var(--c);padding-top:8px;display:grid;gap:2px;min-width:0}
.routebar b{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:18px}
.routebar .code{justify-self:start}
.routebar .mono{font-size:12px}
.ctarow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.tog{display:inline-flex;gap:8px;align-items:center;font-size:14px}
.nx{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.nx .d{font-size:13px;color:var(--muted)}
.bline{display:flex;gap:10px;align-items:baseline}
.bline b{font-size:24px}
.bbar{position:relative;display:flex;height:16px;border-radius:3px;background:var(--surface-2);overflow:visible}
.bbar i{display:block;height:100%;background:var(--ink)}
.bbar i:first-child{border-radius:3px 0 0 3px}
.bbar .tgt{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bad)}
.blegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.blegend span{display:inline-flex;gap:6px;align-items:center}
.blegend i{width:10px;height:10px;background:var(--ink);border-radius:2px;display:inline-block}
.rtag{display:inline-flex;gap:4px;align-items:center;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.rtag svg{width:14px;height:14px}
.rec{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;padding:10px 12px;border-left:3px solid var(--c);background:var(--surface);font-size:14px;margin-top:8px}
.tip{margin-top:6px;font-size:14px}
.tip summary{cursor:pointer;color:var(--muted);font-size:13px}
.tip p{margin:6px 0 0;max-width:70ch}
.tip[open] summary{color:var(--ink)}
.vrow{margin-top:8px;gap:6px}
.card.isrec{border-color:var(--c)}
.pickbadge.recb{background:var(--surface);color:var(--c);border:1px solid var(--c)}
.cards.grid{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));overflow:visible}
.seg button .rtag{margin-bottom:2px}
/* timeline */
.tl{width:100%;height:56px;display:block}
.tl .tk{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.bk{fill:transparent;stroke:var(--muted);stroke-width:1;vector-effect:non-scaling-stroke}
.bk.pick{fill:var(--c);stroke:var(--c)}
.bk.open{stroke-dasharray:4 3}
.bk.free{fill:var(--surface-2)}
.bk.rest{fill:var(--surface-2);stroke:none}
.bk.fixed{fill:var(--ink);stroke:var(--ink)}
.tlx{position:relative;height:16px;font-size:11px;color:var(--muted)}
.tlx span{position:absolute;transform:translateX(-50%)}
.tll{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:4px}
.tll span{display:inline-flex;gap:6px;align-items:center}
.tll i{width:14px;height:10px;display:inline-block;border:1px solid var(--muted);border-radius:2px}
.tll i.pick{background:var(--c);border-color:var(--c)} .tll i.open{border-style:dashed} .tll i.rest{background:var(--surface-2);border-color:var(--surface-2)} .tll i.fixed{background:var(--ink);border-color:var(--ink)}
.cfl{display:grid;grid-template-columns:auto 1fr;gap:8px;color:var(--bad);font-size:14px;margin-top:6px}
/* map */
.map{width:100%;max-width:100%;height:auto;display:block}
.map .ring{fill:none;stroke:var(--line);stroke-dasharray:3 4}
.map .rl{fill:var(--muted);font:11px var(--f-mono)}
.map .pp{fill:var(--c);stroke:var(--surface);stroke-width:2}
.map .po{fill:var(--surface);stroke:var(--muted);stroke-width:1.2}
.map .pl{fill:var(--ink);font:600 11px var(--f-body);paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.map .hh{fill:var(--ink)}
/* guide */
.guide{padding-block:18px 30px;display:grid;gap:12px}
.gtop{display:grid;gap:6px}
.gmeta{font-size:13px}
.gprog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.gprog i{display:block;height:100%;background:var(--c)}
.gintro{margin:0;color:var(--muted);max-width:70ch}
.gq{font-family:var(--f-display);font-weight:800;font-stretch:112%;font-size:clamp(24px,5vw,38px);line-height:1.05;margin:4px 0 0;text-wrap:balance}
.gtime{font-size:15px;font-weight:500;font-family:var(--f-mono)}
.gopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.gopt{display:grid;gap:4px;text-align:left;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.gopt b{font-size:19px}
.gopt span{color:var(--muted)}
.gopt[aria-pressed="true"]{border:2px solid var(--c);padding:17px}
.gopt[aria-pressed="true"] b{color:var(--c)}
.gnav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.gnav .fill{margin-left:auto}
/* compare */
.cmpwrap{overflow-x:auto;border-top:1px solid var(--ink)}
.cmp{border-collapse:collapse;min-width:100%;font-size:14px}
.cmp th{position:sticky;left:0;background:var(--bg);text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px 10px 0;vertical-align:top;min-width:92px}
.cmp td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--line);min-width:190px;max-width:260px}
.cmp .cimg{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;display:block}
.cmp .ph{aspect-ratio:4/3;font-size:16px}
.flagtxt{color:var(--warn);font-size:13px}
/* mobile bottom nav */
.tabs button{display:inline-flex;gap:6px;align-items:center}
@media (max-width:700px){
  .wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .tabs{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:10;justify-content:space-around;gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);border-bottom:0}
  .tabs button{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;border-radius:8px;flex:1;min-width:0}
  .tabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .tabs button[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
  .tabs svg.i{width:22px;height:22px}
}

/* ===== Trip app (phone itinerary) =====
   Layout: one phone column, sticky top bar, fixed bottom tab bar; content cards on a white-green ground.
   Palette: greens on white, black type. Charm: Bodoni italic name + a hand-drawn route line. */
:root{
  --g-bg:#F5F8F4; --g-surface:#FFFFFF; --g-ink:#0D120E; --g-muted:#5B6B5F; --g-line:#DDE7DE;
  --g-deep:#14563A; --g-mid:#2F8A5B; --g-soft:#E2F1E6; --g-leaf:#9ED1AE;
  --g-mad:#14563A; --g-par:#2C8A75; --g-bcn:#6E8F22;
  --g-water:#CFE4EA; --g-park:#D7ECD6; --g-road:#FFFFFF; --g-road2:#E9EEE8; --g-land:#F1F4EF; --g-roadline:#D3DBD2;
  --g-warn:#9A5800; --g-ok:#14563A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --g-bg:#0C120E; --g-surface:#131C16; --g-ink:#EEF4EF; --g-muted:#9AAE9F; --g-line:#24332A;
    --g-deep:#7FD3A1; --g-mid:#5DBB86; --g-soft:#16291E; --g-leaf:#2F6B49;
    --g-mad:#7FD3A1; --g-par:#6CC9B3; --g-bcn:#B9D46A;
    --g-water:#173039; --g-park:#18301F; --g-road:#2A372F; --g-road2:#1F2A23; --g-land:#101812; --g-roadline:#26332B;
    --g-warn:#E3A344; --g-ok:#7FD3A1;
  }
}
:root[data-theme="dark"]{
  --g-bg:#0C120E; --g-surface:#131C16; --g-ink:#EEF4EF; --g-muted:#9AAE9F; --g-line:#24332A;
  --g-deep:#7FD3A1; --g-mid:#5DBB86; --g-soft:#16291E; --g-leaf:#2F6B49;
  --g-mad:#7FD3A1; --g-par:#6CC9B3; --g-bcn:#B9D46A;
  --g-water:#173039; --g-park:#18301F; --g-road:#2A372F; --g-road2:#1F2A23; --g-land:#101812; --g-roadline:#26332B;
  --g-warn:#E3A344; --g-ok:#7FD3A1;
}
body.appmode{background:var(--g-bg);color:var(--g-ink)}
body.appmode .wrap{max-width:560px;padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
.ap{display:grid;gap:16px}
.ap-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--g-bg);margin-inline:-16px;padding:12px 16px 10px;border-bottom:1px solid var(--g-line);display:grid;gap:6px}
.ap-toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ap-name{font-family:"Fraunces",Georgia,serif;font-style:normal;font-weight:600;font-size:23px;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.ap-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 30%;flex:none;border:2px solid var(--g-bg);box-shadow:0 0 0 1.5px var(--g-deep)}
.ap-toprow .ap-name{flex:1;min-width:0}

.ap-name b{font-style:normal;font-weight:700;color:var(--g-deep)}
.ap-sub{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--g-muted);flex-wrap:wrap}

.ap-dates::-webkit-scrollbar{display:none}
.ap-date{flex:none;width:52px;padding:7px 0 8px;border-radius:12px;border:1px solid var(--g-line);background:var(--g-surface);display:grid;justify-items:center;gap:1px}
.ap-date small{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--g-muted)}

.ap-date[aria-current="date"] i{background:var(--g-surface)}
.ap-dayhead{display:grid;gap:4px}

.ap-stay b{font-size:15px}

.ap-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--g-surface);color:var(--g-deep);flex:none;border:1px solid var(--g-line)}
.ap-tl{display:grid;gap:0;position:relative}

.ap-time{font:600 12px var(--f-mono);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:center;padding-top:12px;display:grid;gap:2px;justify-items:center;background:var(--g-bg);position:relative;z-index:1;height:max-content}
.ap-time small{font-weight:400;color:var(--g-muted);font-size:11px}
.ap-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;text-align:left;width:100%;padding:12px;border-radius:14px;background:var(--g-surface);border:1px solid var(--g-line);min-width:0}
.ap-card .t{display:grid;gap:3px;min-width:0}

.ap-card.fixed{background:var(--g-soft)}
.ap-card.rest{background:transparent;border-style:dashed}
.ap-card.todo{background:transparent;border:1.5px dashed var(--g-deep)}
.ap-card.todo .ar{color:var(--g-deep);font-weight:600}
.ap-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.ap-chip{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--g-line);color:var(--g-muted);display:inline-flex;align-items:center;gap:4px}
.ap-chip.ok{background:var(--g-deep);border-color:var(--g-deep);color:var(--g-surface)}
.ap-chip.todo{color:var(--g-warn);border-color:currentColor}
.ap-chip svg{width:12px;height:12px}

.ap-empty{padding:16px;border-radius:14px;border:1px dashed var(--g-line);color:var(--g-muted);font-size:14px}
.ap-tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--g-surface);border-top:1px solid var(--g-line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr)}
.ap-tabs button{display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;padding:6px 0;color:var(--g-muted);border-radius:10px}
.ap-tabs button[aria-current="page"]{color:var(--g-deep);background:var(--g-soft)}

/* calendar */

(function(){
  const one=(h,m)=>{ h=+h; const ap=h<12||h===24?"am":"pm"; let hh=h%12; if(hh===0) hh=12; return {t:m==="00"?String(hh):hh+":"+m, ap}; };

  const SINGLE=/\b([01]?\d|2[0-4]):([0-5]\d)\b(?!\s*(?:am|pm|AM|PM))/g;
  function conv(str){
    if(str.indexOf(":")<0) return str;
    str=str.replace(RANGE,(_,h1,m1,dash,h2,m2)=>{ const a=one(h1,m1), b=one(h2,m2); return a.ap===b.ap ? a.t+"–"+b.t+b.ap : a.t+a.ap+"–"+b.t+b.ap; });

  }
  window.__to12=conv;
  const SKIP={TEXTAREA:1,SCRIPT:1,STYLE:1,INPUT:1,CODE:1};
  function walk(root){

async function refreshProfiles(){

function likesFor(sid,oid){ return Object.values(st.likes).filter(l=>l.slot===sid && (l.opts||[]).includes(oid)).map(l=>l.uid); }
function hotelFor(city){ const p=pickOf(H[city]); return p && opt(p.opt); }
function walk(o,city){
  const h=hotelFor(city); if(!h||o.lat==null||h.lat==null||["hotel","transport","daytrip","admin"].includes(o.kind)) return null;
  const R=6371,toR=x=>x*Math.PI/180; const dLat=toR(o.lat-h.lat), dLng=toR(o.lng-h.lng);
  const a=Math.sin(dLat/2)**2+Math.cos(toR(h.lat))*Math.cos(toR(o.lat))*Math.sin(dLng/2)**2; const km=2*R*Math.asin(Math.sqrt(a))*1.25;
  if(km>30) return null; const w=Math.round(km/4.6*60);
  return w<=30 ? `~${Math.max(2,w)} ${S().walkMin}` : `~${Math.round(km/22*60+6)} ${S().taxiMin}`;
}
function legTime(a,b){
  if(!a||!b||a.lat==null||b.lat==null) return null;
  const R=6371,toR=x=>x*Math.PI/180; const dLat=toR(b.lat-a.lat), dLng=toR(b.lng-a.lng);
  const q=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2; const km=2*R*Math.asin(Math.sqrt(q))*1.25;
  if(km>30) return null; const w=Math.round(km/4.6*60);
  return w<=25 ? {walk:true,min:Math.max(2,w)} : {walk:false,min:Math.round(km/22*60+6)};
}
function prevStop(s,d){
  if(!s||!d||!d.items) return null; if(s.fromHotel) return hotelFor(d.city); let prev=null;
  for(const it of d.items){ if(it.id===s.id) break; if(it.atHotel||(it.t==="rest"&&slotActive(it)&&/hotel/i.test((it.label&&it.label.en)||""))){ prev=null; continue; } if(it.t!=="slot"||it.stay||!slotActive(it)) continue;
    const p=pickOf(it.id); const o=p&&opt(p.opt); if(o&&o.lat!=null&&!["transport","daytrip","admin"].includes(o.kind)) prev=o; }
  return prev||hotelFor(d.city);
}
function fromPrev(o,s,d){
  if(!o||o.lat==null||["hotel","transport","daytrip","admin"].includes(o.kind)) return null;
  const a=prevStop(s,d); if(!a||a.id===o.id) return null; const t=legTime(a,o); if(!t) return null;
  const nm=a.kind==="hotel"?(lang==="es"?"el hotel":"the hotel"):a.name;
  return lang==="es" ? `~${t.min} min ${t.walk?"a pie":"en taxi"} desde ${nm}` : `~${t.min} min ${t.walk?"walk":"taxi"} from ${nm}`;
}

function stats(){
  const act=SLOTS.filter(slotActive); let picked=0,booked=0,sum=0;
  act.forEach(s=>{ const p=pickOf(s.id); if(!p) return; picked++; if(p.booked) booked++; const o=opt(p.opt); sum += (p.booked && p.cost!=null && p.cost!=="") ? Number(p.cost) : (o?.price?.eur_couple||0); });
  const days=Math.max(0,Math.ceil((new Date("2026-10-17T08:00:00+02:00")-Date.now())/864e5));
  return {total:act.length,picked,booked,sum,days,budget:Number(st.meta.settings?.budget)||5000};
}

function events(){
  const ev=[];

    const tz=CITY[d.city].tz;
    if(it.t==="fixed"&&it.cal&&slotActive(it)) ev.push({key:it.id,date:d.date,start:it.start,end:it.end||fmt(hm(it.start)+60),title:tx(it.label),tz,desc:"",loc:it.where||"",booked:true});
    if(it.t!=="slot"||!slotActive(it)) return; const p=pickOf(it.id); if(!p) return; const o=opt(p.opt); if(!o) return;
    if(onlyBooked && !p.booked && needsBooking(o)) return;
    const pre = needsBooking(o)&&!p.booked ? (lang==="es"?"[Por reservar] ":"[To book] ") : "";
    const desc=[tx(o.why), p.conf?(S().conf+": "+p.conf):"", tx(o.hours)?(S().hours+": "+tx(o.hours)):"", o.flags?.food?tx(o.flags.food):"", safeUrl(o.book?.url)?(S().book+": "+o.book.url):"", safeUrl(o.links?.website)||""].filter(Boolean).join("\n");
    if(it.stay) ev.push({key:it.id,date:it.stay.from,to:it.stay.to,allDay:true,title:pre+o.name,tz,desc,loc:o.address||"",booked:p.booked});
    else { const tm=slotTime(it); ev.push({key:it.id,date:d.date,start:tm.start,end:tm.end,title:pre+o.name,tz,desc,loc:o.address||o.name,booked:p.booked,opt:o.id}); }
  }));

}

const sig = e => [e.title,e.date,e.to||"",e.start||"",e.end||"",e.loc].join("|");
function offset(date,time){ // CEST until Oct 25 03:00 local, CET after
  return (date<"2026-10-25" || (date==="2026-10-25" && (time||"00:00")<"03:00")) ? "+02:00" : "+01:00";
}
function icsEsc(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); }
function fold(line){ const enc=new TextEncoder(); let out="",cur="",len=0; for(const ch of line){ const b=enc.encode(ch).length; if(len+b>74){ out+=cur+"\r\n "; cur=""; len=1; } cur+=ch; len+=b; } return out+cur; }
const VTZ = tz=>["BEGIN:VTIMEZONE","TZID:"+tz,"BEGIN:DAYLIGHT","TZOFFSETFROM:+0100","TZOFFSETTO:+0200","TZNAME:CEST","DTSTART:19700329T020000","RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU","END:DAYLIGHT","BEGIN:STANDARD","TZOFFSETFROM:+0200","TZOFFSETTO:+0100","TZNAME:CET","DTSTART:19701025T030000","RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU","END:STANDARD","END:VTIMEZONE"];
function buildIcs(){
  const now=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const L2=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Honeymoon Trip Builder//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Honeymoon 2026",...VTZ("Europe/Madrid"),...VTZ("Europe/Paris")];
  const dt=(d,t)=>d.replace(/-/g,"")+"T"+t.replace(":","")+"00";
  events().forEach(e=>{
    L2.push("BEGIN:VEVENT","UID:"+e.key+"@honeymoon-trip-builder","DTSTAMP:"+now);
    if(e.allDay){ L2.push("DTSTART;VALUE=DATE:"+e.date.replace(/-/g,""),"DTEND;VALUE=DATE:"+e.to.replace(/-/g,""),"TRANSP:TRANSPARENT"); }
    else { const endDate = hm(e.end)<hm(e.start) ? new Date(new Date(e.date+"T12:00:00Z").getTime()+864e5).toISOString().slice(0,10) : e.date;
      L2.push("DTSTART;TZID="+e.tz+":"+dt(e.date,e.start),"DTEND;TZID="+e.tz+":"+dt(endDate,e.end)); }
    L2.push("SUMMARY:"+icsEsc(e.title)); if(e.loc) L2.push("LOCATION:"+icsEsc(e.loc)); if(e.desc) L2.push("DESCRIPTION:"+icsEsc(e.desc));
    L2.push("END:VEVENT");
  });
  L2.push("END:VCALENDAR"); return L2.map(fold).join("\r\n")+"\r\n";
}
/* minimal stored zip */
const CRC=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return b=>{ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=t[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }; })();
function zip(name,text){
  const enc=new TextEncoder(), data=enc.encode(text), fn=enc.encode(name), crc=CRC(data), n=data.length;
  const lh=new DataView(new ArrayBuffer(30)); [[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,0,2],[12,0x21,2],[14,crc,4],[18,n,4],[22,n,4],[26,fn.length,2],[28,0,2]].forEach(([o,v,s])=>s===4?lh.setUint32(o,v,true):lh.setUint16(o,v,true));
  const cd=new DataView(new ArrayBuffer(46)); [[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,0,2],[12,0,2],[14,0x21,2],[16,crc,4],[20,n,4],[24,n,4],[28,fn.length,2],[30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,0,4]].forEach(([o,v,s])=>s===4?cd.setUint32(o,v,true):cd.setUint16(o,v,true));
  const off=30+fn.length+n, cdl=46+fn.length;
  const eo=new DataView(new ArrayBuffer(22)); [[0,0x06054b50,4],[4,0,2],[6,0,2],[8,1,2],[10,1,2],[12,cdl,4],[16,off,4],[20,0,2]].forEach(([o,v,s])=>s===4?eo.setUint32(o,v,true):eo.setUint16(o,v,true));
  return new Blob([lh,fn,data,cd,fn,eo],{type:"application/zip"});
}
async function downloadIcs(){
  const text=buildIcs();
  const dl = await cu("downloads");
  if(!dl){ busy.icsText=text; render(); toast(lang==="es"?"Copia el texto de abajo":"Copy the text below"); return; }
  try{ await dl.save({filename:"honeymoon-2026.zip",data:zip("honeymoon-2026.ics",text)}); toast("honeymoon-2026.zip"); }
  catch(e){ if(e&&e.code==="declined") return; busy.icsText=text; render(); }
}

    const input = e.allDay
      ? {summary:e.title,allDay:true,startTime:e.date+"T00:00:00",endTime:e.to+"T00:00:00",timeZone:e.tz,location:e.loc,description:e.desc,availability:"AVAILABILITY_FREE"}
      : {summary:e.title,startTime:`${e.date}T${e.start}:00${off}`,endTime:`${hm(e.end)<hm(e.start)?e.date:e.date}T${e.end}:00${offset(e.date,e.end)}`,timeZone:e.tz,location:e.loc,description:e.desc};
    if(!e.allDay && hm(e.end)<hm(e.start)){ const nd=new Date(new Date(e.date+"T12:00:00Z").getTime()+864e5).toISOString().slice(0,10); input.endTime=`${nd}T${e.end}:00${offset(nd,e.end)}`; }
    try{
      let id=g&&g.eventId;
      if(id){ await mcp.callTool("Google Calendar","update_event",{eventId:id,...input,notificationLevel:"NONE"}); }
      else { const r=await mcp.callTool("Google Calendar","create_event",input); const pl=r&&r.payload;
        id = pl && (pl.id||pl.eventId||(pl.event&&pl.event.id)) || (typeof pl==="string" && (pl.match(/"id"\s*:\s*"([^"]+)"/)||[])[1]) || null; }
      await put("gcal",e.key,{eventId:id,sig:sig(e),...stamp()}); n++;
    }catch(x){ err=x; break; }
  }
  busy.gcal=false;
  if(err){ busy.gcalErr=true; const c=err.code;
    busy.gcalMsg = c==="server_not_connected"?(lang==="es"?"Agrega Google Calendar en claude.ai → Configuración → Conectores.":"Add Google Calendar in claude.ai Settings → Connectors.")
      : c==="needs_reauth"?(lang==="es"?"Vuelve a conectar Google Calendar en claude.ai → Configuración → Conectores.":"Reconnect Google Calendar in claude.ai Settings → Connectors.")
      : c==="not_in_manifest"?(lang==="es"?"Google Calendar no está permitido para esta página.":"Google Calendar isn't allowed for this page.")
      : (err.message||"Error")+(n?` (${n} ok)`:"");
  } else { busy.gcalMsg = n? `${S().gcalDone}: ${n}` : S().gcalNone; }
  render();
}

async function askIdeas(sid){
  const s=SLOT[sid]; const d=s.day; const sample=await cu("sample");
  if(!sample){ busy["err-"+sid]=true; render(); return; }
  busy[sid]=true; busy["err-"+sid]=false; render();
  const have=slotOpts(s).map(opt).filter(Boolean).map(o=>o.name).join(", ");
  const hotel=hotelFor(d.city); const tm=slotTime(s);
  const prompt=`You help a honeymoon couple plan one time slot. They speak Spanish and English, not French. The wife is pregnant: no wine bars or wine-focused places, and avoid menus built around raw fish, raw meat or cured meats. Taste: industrial, avant-garde, modern design (Liz Lambert / Bunkhouse hotels). Budget is conservative: meals about €30–90 per person.
City: ${tx(CITY[d.city].name)}. Date: ${dateLabel(d.date,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}. Slot: ${tx(s.label)}, about ${tm?tm.start:""}–${tm?tm.end:""}. ${hotel?"Hotel: "+hotel.name+", "+(hotel.area||"")+".":""}
Already on their list: ${have}.
Suggest 3 different real places that exist today and are normally open on that weekday at that time. Only suggest places you are confident exist.
Reply with only a JSON array like [{"name":"...","area":"neighborhood","kind":"food|bar|sight|event","why":"one line, max 80 characters, in ${lang==="es"?"Spanish":"English"}","price":"like ~€40 pp","eur_couple":80}]`;
  try{
    const arr=await sample.json(prompt,{modelTier:"default"});
    if(!Array.isArray(arr)) throw {code:"invalid_json"};
    for(const x of arr.slice(0,3)){ if(!x||!x.name) continue;
      const id="i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      await put("ideas",id,{slot:sid,city:tx(CITY[d.city].name),name:String(x.name).slice(0,80),area:String(x.area||"").slice(0,60),kind:["food","bar","sight","event"].includes(x.kind)?x.kind:"food",why:String(x.why||"").slice(0,120),price:String(x.price||"").slice(0,30),eur:Number(x.eur_couple)||0,...stamp()}); }
  }catch(e){ busy["err-"+sid]=true; }
  busy[sid]=false; render();
}

function nextActions(){

  DAYS.forEach(d=>d.items.forEach(it=>{ if(it.t==="dec" && !st.dec[it.id]) acts.push({rank:2.6,kind:"dec",date:d.date,d,it}); }));
  SLOTS.filter(slotActive).forEach(s=>{ const p=pickOf(s.id);
    if(!p){ const us=slotOpts(s).map(opt).filter(Boolean).map(o=>urg(o)[0]); const r=us.length?Math.min(...us):9; acts.push({rank:r,kind:"pick",date:s.day.date,s}); }
    else { const o=opt(p.opt); if(o && needsBooking(o) && !p.booked){ const g=urg(o); acts.push({rank:g[0]-0.5,kind:"book",date:s.day.date,s,o,g}); } }

  return acts.sort((a,b)=>a.rank-b.rank || a.date.localeCompare(b.date));

function spendBy(){ const c={hotel:0,food:0,tickets:0,transport:0};

    const k=o.kind==="hotel"?"hotel":["food","bar"].includes(o.kind)?"food":o.kind==="transport"?"transport":"tickets"; c[k]+=v; });
  return c; }

/* ---------- timeline + map (day view) ---------- */
function dayTimeline(d){
  const X=m=>Math.max(0,Math.min(1000,(m-420)/1080*1000)); const blocks=[]; const picks=[];
  d.items.forEach(it=>{
    if(it.t==="rest") blocks.push({k:"rest",a:hm(it.start),b:hm(it.end),l:S().rest});
    else if(it.t==="fixed"&&slotActive(it)) blocks.push({k:"fixed",a:hm(it.start),b:hm(it.end||fmt(hm(it.start)+45)),l:tx(it.label)});
    else if(it.t==="slot"&&slotActive(it)&&!it.stay){ const tm=slotTime(it); let a=hm(tm.start),b=hm(tm.end); if(a<300){a+=1440;b+=1440;} if(b<=a) b+=1440;
      const p=pickOf(it.id); const o=p&&opt(p.opt); blocks.push({k:o?"pick":p?"free":"open",a,b,l:o?o.name:(p?u("freeTime"):tx(it.label))}); if(o) picks.push({a,b,l:o.name}); }
  });
  picks.sort((x,y)=>x.a-y.a); const cf=[]; for(let i=1;i<picks.length;i++) if(picks[i].a<picks[i-1].b) cf.push([picks[i-1],picks[i]]);
  const ticks=[8,10,12,14,16,18,20,22,24];
  const svg=`<svg class="tl" viewBox="0 0 1000 64" preserveAspectRatio="none" role="img" aria-label="${u("timelineH")}">
   ${ticks.map(h=>`<line x1="${X(h*60)}" y1="0" x2="${X(h*60)}" y2="46" class="tk"/>`).join("")}
   ${blocks.map(b=>`<rect x="${X(b.a)+1}" y="8" width="${Math.max(3,X(b.b)-X(b.a)-2)}" height="30" rx="3" class="bk ${b.k}"><title>${esc(fmt(b.a))}–${esc(fmt(b.b))} · ${esc(b.l)}</title></rect>`).join("")}
  </svg><div class="tlx mono">${ticks.map(h=>`<span style="left:${X(h*60)/10}%">${String(h%24).padStart(2,"0")}</span>`).join("")}</div>`;
  const lg=`<div class="tll"><span><i class="bk pick"></i>${u("legendPick")}</span><span><i class="bk open"></i>${u("legendOpen")}</span><span><i class="bk rest"></i>${u("legendRest")}</span><span><i class="bk fixed"></i>${u("legendFixed")}</span></div>`;
  const cfx=cf.length?`<div class="cfl">${ic("warn")}<div><b>${u("conflict")}:</b> ${cf.map(([a,b])=>`${esc(a.l)} (${fmt(a.a)}–${fmt(a.b)}) · ${esc(b.l)} (${fmt(b.a)}–${fmt(b.b)})`).join("; ")}<div class="note">${u("conflictP")}</div></div></div>`:"";
  return `<div class="panel"><h3 class="ph3">${u("timelineH")}</h3>${svg}${lg}${cfx}</div>`;
}
function dayMap(d){
  const seen={}; const pts=[];
  d.items.forEach(it=>{ if(it.t!=="slot"||!slotActive(it)||it.stay) return; const p=pickOf(it.id);
    slotOpts(it).forEach(id=>{ const o=opt(id); if(!o||o.lat==null||["transport","daytrip"].includes(o.kind)) return; const pk=!!(p&&p.opt===id);
      if(seen[id]){ if(pk) seen[id].picked=true; return; } seen[id]={o,picked:pk}; pts.push(seen[id]); }); });
  if(!pts.length) return "";
  const hotel=hotelFor(d.city); const hasH=hotel&&hotel.lat!=null;
  const c0=hasH?{lat:hotel.lat,lng:hotel.lng}:{lat:pts.reduce((a,p)=>a+p.o.lat,0)/pts.length,lng:pts.reduce((a,p)=>a+p.o.lng,0)/pts.length};
  const kx=111.32*Math.cos(c0.lat*Math.PI/180), ky=110.57;
  pts.forEach(p=>{ p.x=(p.o.lng-c0.lng)*kx; p.y=-(p.o.lat-c0.lat)*ky; p.r=Math.hypot(p.x,p.y); });
  const rs=pts.map(p=>p.r).sort((a,b)=>a-b); let R=rs[Math.min(rs.length-1,Math.floor(rs.length*0.85))]*1.15; R=Math.max(1.4,Math.min(6,R||1.4));
  const W=420,Hh=300,cx=210,cy=150,sc=128/R; const inside=pts.filter(p=>p.r<=R*1.15); const out=pts.length-inside.length;
  const rings=[[1.2,u("walk15")],[2.4,u("walk30")]].filter(([r])=>r<=R*1.15);
  inside.sort((a,b)=>a.picked-b.picked);
  const svg=`<svg class="map" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${u("mapH")}">
    ${rings.map(([r,l])=>`<circle cx="${cx}" cy="${cy}" r="${r*sc}" class="ring"/><text x="${cx+r*sc*0.71+4}" y="${cy-r*sc*0.71-4}" class="rl">${esc(l)}</text>`).join("")}
    ${inside.map(p=>{ const x=cx+p.x*sc, y=cy+p.y*sc; return p.picked?`<g><circle cx="${x}" cy="${y}" r="6" class="pp"/><text x="${x+9}" y="${y+4}" class="pl">${esc(p.o.name.length>26?p.o.name.slice(0,25)+"…":p.o.name)}</text></g>`:`<circle cx="${x}" cy="${y}" r="3.5" class="po"><title>${esc(p.o.name)}</title></circle>`; }).join("")}
    ${hasH?`<rect x="${cx-7}" y="${cy-7}" width="14" height="14" class="hh"/><text x="${cx+11}" y="${cy+18}" class="pl hl">${esc(u("hotel"))}</text>`:""}
  </svg>`;
  return `<div class="panel"><h3 class="ph3">${u("mapH")}</h3>${svg}<p class="note">${hasH?u("mapHotel"):u("mapNoHotel")}${out?` · ${out} ${u("farther")}`:""}</p></div>`;
}

function inBox(o,m){ const [s,nn,w,e]=m.bbox; return o.lat>=s&&o.lat<=nn&&o.lng>=w&&o.lng<=e; }
function proj(m,lat,lng){ const Z=14; const mx=l=>(l+180)/360*2**Z; const my=a=>(1-Math.log(Math.tan(a*Math.PI/180)+1/Math.cos(a*Math.PI/180))/Math.PI)/2*2**Z;
  const [s,n,w,e]=m.bbox; const x0=mx(w), y0=my(n), S=m.w/(mx(e)-x0); return [(mx(lng)-x0)*S,(my(lat)-y0)*S]; }

function fitVB(m){
